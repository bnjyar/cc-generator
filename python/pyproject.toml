[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-generator"
version = "1.0.0"
description = "Generate Luhn-valid test credit card numbers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Hermes Agent"}]
keywords = ["credit-card", "generator", "luhn", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
cc-gen = "cc_generator.cli:main"

[project.urls]
Homepage = "https://github.com/example/cc-generator"
